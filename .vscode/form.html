<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration and Profiling Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="page-container">
        <div class="form-card">
            <h1>Student Registration and Profiling Form</h1>
            <p class="subtitle">Complete your student profile to get started</p>
            
            <form action="#" method="post" autocomplete="on" target="_self">
                
                <fieldset>
                    <legend>Personal Information</legend>
                    
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required maxlength="50">
                    
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required maxlength="50">
                    
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="16" max="65" placeholder="Enter your age" required>
                    
                    <label for="birthdate">Date of Birth</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                    
                    <label for="profile-photo">Profile Photo Upload</label>
                    <input type="file" id="profile-photo" name="profile-photo">
                </fieldset>

                <fieldset>
                    <legend>Academic Information</legend>
                    
                    <label for="school">School Name</label>
                    <input type="text" id="school" name="school" placeholder="Enter your school name" required maxlength="150">
                    
                    <label for="course">Course / Program</label>
                    <select id="course" name="course" required>
                        <option value="">Select your course</option>
                        <option value="bsit">Bachelor of Science in Information Technology</option>
                        <option value="bscs">Bachelor of Science in Computer Science</option>
                        <option value="bsce">Bachelor of Science in Computer Engineering</option>
                        <option value="bsis">Bachelor of Science in Information Systems</option>
                        <option value="bsds">Bachelor of Science in Data Science</option>
                        <option value="bscybersec">Bachelor of Science in Cybersecurity</option>
                    </select>
                    
                    <label>Year Level</label>
                    <div class="radio-group">
                        <label><input type="radio" name="year-level" value="1st" required> 1st Year</label>
                        <label><input type="radio" name="year-level" value="2nd"> 2nd Year</label>
                        <label><input type="radio" name="year-level" value="3rd"> 3rd Year</label>
                        <label><input type="radio" name="year-level" value="4th"> 4th Year</label>
                    </div>
                    
                    <label for="student-id">Student ID Number</label>
                    <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID" required>
                </fieldset>

                <fieldset>
                    <legend>Technical Skills Profile</legend>
                    
                    <label>Programming and Technical Skills (Select all that apply)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="skills" value="html" checked> HTML</label>
                        <label><input type="checkbox" name="skills" value="css"> CSS</label>
                        <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
                        <label><input type="checkbox" name="skills" value="java"> Java</label>
                        <label><input type="checkbox" name="skills" value="python"> Python</label>
                        <label><input type="checkbox" name="skills" value="php"> PHP</label>
                        <label><input type="checkbox" name="skills" value="mysql"> MySQL</label>
                        <label><input type="checkbox" name="skills" value="networking"> Networking</label>
                        <label><input type="checkbox" name="skills" value="database"> Database Management</label>
                        <label><input type="checkbox" name="skills" value="ui-ux"> UI/UX Design</label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Area of Interest</legend>
                    
                    <label for="primary-interest">Primary Interest in IT Field</label>
                    <select id="primary-interest" name="primary-interest" required>
                        <option value="">Select your primary interest</option>
                        <option value="frontend">Frontend Development</option>
                        <option value="backend">Backend Development</option>
                        <option value="fullstack">Full Stack Development</option>
                        <option value="data-analytics">Data Analytics</option>
                        <option value="cybersecurity">Cybersecurity</option>
                        <option value="mobile-dev">Mobile Development</option>
                        <option value="ai-ml">Artificial Intelligence & Machine Learning</option>
                        <option value="networking">Network Administration</option>
                        <option value="ui-ux">UI/UX Design</option>
                        <option value="database">Database Administration</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Self-Assessment</legend>
                    
                    <label for="programming-level">Programming Skill Level</label>
                    <input type="range" id="programming-level" name="programming-level" min="1" max="5" value="3">
                    
                    <label for="problem-solving">Problem Solving Ability (1-10)</label>
                    <input type="range" id="problem-solving" name="problem-solving" min="1" max="10" value="5">
                    
                    <label>Learning Pace</label>
                    <div class="radio-group">
                        <label><input type="radio" name="learning-pace" value="slow"> Slow but thorough</label>
                        <label><input type="radio" name="learning-pace" value="moderate" checked> Moderate</label>
                        <label><input type="radio" name="learning-pace" value="fast"> Fast learner</label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Feedback or Additional Information</legend>
                    
                    <label for="goals">Career Goals</label>
                    <textarea id="goals" name="goals" placeholder="Describe your career goals and aspirations..." maxlength="300" rows="4"></textarea>
                    
                    <label for="experience">Previous Experience</label>
                    <textarea id="experience" name="experience" placeholder="Share any relevant experience or projects..." maxlength="300" rows="4"></textarea>
                    
                    <label for="additional-comments">Additional Comments</label>
                    <textarea id="additional-comments" name="additional-comments" placeholder="Any additional information you'd like to share..." maxlength="200" rows="3"></textarea>
                </fieldset>

                <fieldset>
                    <legend>Consent and Submission</legend>
                    
                    <div class="consent-section">
                        <label class="consent-label">
                            <input type="checkbox" name="data-consent" value="agree" required>
                            I agree to the collection and processing of my personal data for academic purposes
                        </label>
                    </div>
                    
                    <div class="button-group">
                        <button type="submit">Submit Registration</button>
                        <button type="reset">Reset Form</button>
                    </div>
                </fieldset>
                
            </form>
        </div>
    </div>
</body>
</html>
